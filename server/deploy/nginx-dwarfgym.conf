# nginx: /etc/nginx/conf.d/dwarfgym.conf, then: certbot --nginx -d dwarfgym.live -d www.dwarfgym.live
server {
    listen 80;
    server_name dwarfgym.live www.dwarfgym.live;

    location / {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;          # live group updates (server-sent events)
        proxy_read_timeout 1h;
    }
}
