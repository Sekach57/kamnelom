# dwarfgym.live -> the "dwarfgym" container (site + API). Same layout as feehound.conf:
# the upstream is resolved through Docker DNS at request time, so this shared nginx still
# starts and reloads when the dwarfgym container is down.
# Copy to /opt/budget-app/nginx/conf.d/dwarfgym.conf (replaces the step 1 file).
server {
    listen 80;
    listen [::]:80;
    server_name dwarfgym.live www.dwarfgym.live;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://dwarfgym.live$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.dwarfgym.live;

    ssl_certificate /etc/letsencrypt/live/dwarfgym.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dwarfgym.live/privkey.pem;

    return 301 https://dwarfgym.live$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dwarfgym.live;

    ssl_certificate /etc/letsencrypt/live/dwarfgym.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dwarfgym.live/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DWARFSSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The pose model (wasm) is large; text and wasm compress well.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/wasm;
    gzip_min_length 256;

    client_max_body_size 1M;

    resolver 127.0.0.11 valid=30s;
    set $dwarfgym_upstream http://dwarfgym:4310;

    # Live group updates (server-sent events): no buffering, long timeout.
    location ~ ^/api/groups/[^/]+/stream$ {
        proxy_pass $dwarfgym_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass $dwarfgym_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (not append) so a client cannot fake its address for the rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
