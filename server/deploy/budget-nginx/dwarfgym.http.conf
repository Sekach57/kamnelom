# Step 1 (before the certificate exists): only port 80, so certbot can verify the domain.
# Copy to /opt/budget-app/nginx/conf.d/dwarfgym.conf
server {
    listen 80;
    listen [::]:80;
    server_name dwarfgym.live www.dwarfgym.live;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://dwarfgym.live$request_uri;
    }
}
